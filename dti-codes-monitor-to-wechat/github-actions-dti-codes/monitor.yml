# 在您的项目根目录下，创建 .github/workflows/ 文件夹。
# 在该文件夹下，创建一个新文件 monitor.yml，内容如下：

name: Monitor DTI Codes

on:
  schedule:
    # 每8小时运行一次
    - cron: '0 */8 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install dependencies
        run: pip install requests

      - name: 4. Run checker script
        id: check
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python scripts/check_codes.py

      - name: 5. Commit and push if changed
        if: steps.check.outputs.has_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: Update DTI codes snapshot'
          file_pattern: 'latest_codes.txt'